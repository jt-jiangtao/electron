<!doctype html>
<html><head><meta charset="utf-8"><title>Native window verification</title>
<style>body{font:18px system-ui;padding:40px;background:#fff;color:#222}button,input{font:inherit;padding:12px;margin:12px 0}.scroll{height:180px;overflow:auto;border:1px solid #ccc;padding:12px}.tall{height:1400px}</style></head>
<body><h1>Native window verification</h1><p>The watermark belongs to the window, outside this page.</p>
<button id="counter">Click verification</button><span id="result">0</span><br>
<label for="input">Input verification</label><input id="input">
<div class="scroll"><div class="tall">Scroll verification</div></div>
<script>let count=0;document.querySelector('#counter').onclick=()=>document.querySelector('#result').textContent=String(++count)</script>
</body></html>
